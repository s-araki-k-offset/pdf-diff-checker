[project]
name = "pdf-diff-checker"
version = "0.1.0"
description = "A Python tool for comparing text differences between PDF files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]